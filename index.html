<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kavya ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
color:white;
overflow-x:hidden;
}
.container{
padding:30px 15px;
}
h1{
font-size:38px;
margin-top:20px;
animation:fade 2s;
}
p{
font-size:20px;
margin:15px;
line-height:1.6;
animation:fade 3s;
}
img{
width:90%;
max-width:320px;
border-radius:20px;
margin:15px;
box-shadow:0 0 20px rgba(255,255,255,.5);
transition:.4s;
}
img:hover{
transform:scale(1.05);
}
button{
margin-top:25px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
color:#ff4d6d;
font-weight:bold;
cursor:pointer;
}
#msg{
display:none;
margin-top:25px;
font-size:22px;
font-weight:bold;
padding:15px;
}
@keyframes fade{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ Dear Kavya ❤️</h1>

<p>
Some people make life brighter just by being themselves. ✨
</p>

<img src="IMG_20260802_222816_610.jpg">
<img src="IMG_20260802_222659_590.jpg">
<img src="IMG_20260802_222706_253.jpg">
<img src="IMG_20260802_222712_968.jpg">

<button onclick="showMsg()">Open Surprise ❤️</button>

<div id="msg">
🌹 Thank you for being such a wonderful person, Kavya. <br><br>
May your smile always stay the same. ✨❤️
</div>

</div>

<script>
function showMsg(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
